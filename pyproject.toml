[project]
name = "presidential-daily-briefing"
version = "0.1.0"
description = "Automated geopolitical intelligence briefing system"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "httpx>=0.27",
    "resend>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
